name: PaseoWithPi

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and publish'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  docker_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get latest pi-coding-agent v1 version
        id: latest_pi
        run: |
          TAG=$(npm view "@earendil-works/pi-coding-agent@^1" version --json | jq -r 'if type == "array" then last else . end')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest paseo version
        id: latest_paseo
        run: |
          TAG=$(npm view @getpaseo/cli version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and publish image
        uses: ilteoood/docker_buildx@master
        with:
          tag: ${{ github.event.inputs.tag || 'latest' }}
          platform: linux/amd64,linux/arm64
          imageName: eomm/paseo-with-pi-agent
          dockerFile: Dockerfile.paseo-with-pi-agent
          label: pi_version=${{ steps.latest_pi.outputs.tag }},paseo_version=${{ steps.latest_paseo.outputs.tag }}
          publish: true
          dockerUser: ${{ secrets.DOCKER_HUB_USER }}
          dockerPassword: ${{ secrets.DOCKER_HUB_PASSWORD }}
